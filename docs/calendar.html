<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课间 · 周课程表</title><style>
:root{--ink:#18332d;--muted:#74847a;--line:#dfe6df;--green:#164d39;--paper:#f8f9f5}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}header{padding:25px 5vw 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:22px;font-weight:750;color:var(--green)}.brand small{font-size:10px;display:block;letter-spacing:1.5px;color:var(--muted)}.header-actions,.controls,.buttons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d1dbd2;background:#fff;border-radius:3px;padding:10px 14px}.btn:hover{background:#eaf2eb}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:#a23f38}.wrap{padding:28px 5vw;max-width:1600px;margin:auto}.title{display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:34px;margin:0;letter-spacing:-1px}h2{font-size:19px;margin:0}p{line-height:1.6}.muted{color:var(--muted)}.hint{font-size:12px;color:var(--muted)}.summary{font-size:15px;margin:24px 0 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:910px}.scroll{overflow:auto}.day{min-height:320px;padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.dayhead{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.add-day{border:0;background:transparent;color:var(--green);font-size:20px;padding:0 4px}.event{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--bg);border-radius:2px;padding:10px;margin-top:10px;min-height:86px}.event b,.event span{display:block;overflow-wrap:anywhere}.event b{margin:5px 0}.event span{font-size:12px}.none{font-size:12px;color:#9bac9f;margin-top:18px}.note{padding:18px 0;border-bottom:1px solid var(--line)}dialog{border:1px solid var(--line);border-radius:5px;padding:0;width:min(550px,calc(100% - 28px));color:var(--ink);box-shadow:0 16px 60px #102b1c30}dialog::backdrop{background:#10251c80}.modal{padding:24px}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:none;font-size:25px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;color:#667b70;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #cbd8ce;background:white;padding:10px;border-radius:3px}textarea{min-height:75px;resize:vertical}.timepair{display:grid;grid-template-columns:1fr 1fr;gap:7px}.timepair select{max-height:200px}input[type=checkbox]{width:auto}.check{display:flex;gap:8px;align-items:center;margin-top:18px}.check label{margin:0}.buttons{justify-content:flex-end;margin-top:20px}.buttons .left{margin-right:auto}.error{color:#a43d37;min-height:20px}.mobile-list{display:none}.file{display:none}.foot{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);color:#75867a;font-size:12px;line-height:1.6}@media(max-width:800px){header{align-items:flex-start;flex-direction:column;padding:18px}.wrap{padding:23px 18px}.header-actions{width:100%}h1{font-size:28px}.scroll{display:none}.mobile-list{display:block}.mobile-day{border-bottom:1px solid var(--line);padding:16px 0}.mobile-day .event{min-height:0;padding:12px;margin-top:8px}.formgrid{grid-template-columns:1fr}.summary{margin:18px 0}.header-actions .btn{padding:9px}.modal{padding:20px}}
</style></head><body><header><div class="brand">课间<small>WEEKLY PLANNER</small></div><div class="header-actions"><button class="btn" id="load">导入 JSON</button><input id="file" class="file" type="file" accept=".json,application/json"><button class="btn" id="save-json">导出 JSON</button><button class="btn primary" id="export-ics">⇩ 导出到 Apple Calendar</button></div></header><main class="wrap"><div class="title"><div><h1>我的周课程表</h1><p class="muted">周一到周日 · 点击课程可修改时间、年级与备注</p></div><button class="btn primary" id="add">＋ 添加课程</button></div><div class="note"><div class="formgrid"><div><label for="start-date">课表开始日期（选择所在周）</label><input id="start-date" type="date"></div><div><label for="end-date">重复结束日期（可选）</label><input id="end-date" type="date"></div></div><div class="check"><input type="checkbox" id="repeat"><label for="repeat">每周重复导出（未选时只导出所选周）</label></div><p class="hint">课程按北京时间导出；未填写重复结束日期时会持续每周重复。重复结束日期之前的课程才会导出。</p></div><div class="summary"><b id="week-label"></b><span class="muted" id="total"></span></div><div class="scroll"><div class="grid" id="grid"></div></div><div id="mobile" class="mobile-list"></div><p id="message" role="status" class="muted"></p><div class="foot">数据只保存在当前浏览器；建议定期导出 JSON 备份。导出的日历是一次性快照，之后在这里修改课程不会自动同步到 Apple Calendar；重复导入可能产生重复日程。</div></main><dialog id="dialog"><div class="modal"><div class="modal-top"><h2 id="dialog-title">添加课程</h2><button class="close" type="button" id="close" aria-label="关闭">×</button></div><form id="form"><div class="formgrid"><div><label for="day">星期</label><select id="day" required></select></div><div><label for="grade">年级</label><select id="grade" required><option value="">请选择年级</option><option>小学一年级</option><option>小学二年级</option><option>小学三年级</option><option>小学四年级</option><option>小学五年级</option><option>小学六年级</option><option>初一</option><option>初二</option><option>初三</option><option>高一</option><option>高二</option><option>高三</option><option>其他</option></select></div></div><label for="name">课程名称 / 学生（可选）</label><input id="name" maxlength="100" placeholder="例如：数学 · 小明"><div class="formgrid"><div><label>开始时间（滚动选择）</label><div class="timepair"><select id="start-hour" aria-label="开始小时"></select><select id="start-minute" aria-label="开始分钟"></select></div></div><div><label>结束时间（滚动选择）</label><div class="timepair"><select id="end-hour" aria-label="结束小时"></select><select id="end-minute" aria-label="结束分钟"></select></div></div></div><label for="notes">备注（可选）</label><textarea id="notes" maxlength="1000" placeholder="例如：一对一、地点或课程安排"></textarea><div id="form-error" class="error" role="alert"></div><div class="buttons"><button class="btn danger left" id="delete" type="button" hidden>删除课程</button><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit">保存课程</button></div></form></div></dialog><script>
'use strict';const KEY='kejian-weekly-calendar-v1',days=['周一','周二','周三','周四','周五','周六','周日'],byId=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let courses=[],editing=null;function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function localKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function addDays(d,n){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}function parseDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;let [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null}function monday(d){return addDays(d,-((d.getDay()+6)%7))}function isoWeek(){return monday(parseDate(byId('start-date').value)||new Date())}function uid(){return globalThis.crypto?.randomUUID?.()||('lesson-'+Date.now()+'-'+Math.random().toString(36).slice(2))}function valid(c){return c&&typeof c.id==='string'&&c.id.length>0&&c.id.length<=120&&Number.isInteger(c.day)&&c.day>=0&&c.day<7&&typeof c.grade==='string'&&c.grade.length>0&&c.grade.length<=50&&typeof c.name==='string'&&c.name.length<=100&&typeof c.notes==='string'&&c.notes.length<=1000&&/^([01]\d|2[0-3]):[0-5]\d$/.test(c.start)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(c.end)&&c.end>c.start}function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,courses,startDate:byId('start-date').value,endDate:byId('end-date').value,repeat:byId('repeat').checked}))}catch(e){byId('message').textContent='浏览器未能保存，请及时导出 JSON。'}}function color(g){return g.startsWith('初一')||g.startsWith('小学')?['#40875a','#e8f2e8']:g.startsWith('初二')||g.startsWith('高二')?['#4c8dd1','#e5eff9']:['#c66244','#f9ebe5']}function duration(c){let [a,b]=c.start.split(':').map(Number),[x,y]=c.end.split(':').map(Number);return(x*60+y-a*60-b)}function render(){let mon=isoWeek(),end=addDays(mon,6);byId('week-label').textContent=`${mon.getFullYear()}年${mon.getMonth()+1}月${mon.getDate()}日 — ${end.getMonth()+1}月${end.getDate()}日`;byId('total').textContent=`${courses.length} 节 · ${Number((courses.reduce((s,c)=>s+duration(c),0)/60).toFixed(2))} 小时`;let html=days.map((name,i)=>{let list=courses.filter(c=>c.day===i).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="day"><div class="dayhead"><span>${name} <span class="hint">${addDays(mon,i).getMonth()+1}/${addDays(mon,i).getDate()}</span></span><button class="add-day" data-add="${i}" aria-label="${name}添加课程">＋</button></div>${list.map(c=>{let [a,b]=color(c.grade);return `<button class="event" data-id="${esc(c.id)}" style="--accent:${a};--bg:${b}"><span>${esc(c.start)} — ${esc(c.end)}</span><b>${esc(c.grade)}${c.name?' · '+esc(c.name):''}</b><span>${esc(c.notes||'点击查看或编辑')}</span></button>`}).join('')||'<div class="none">暂无课程</div>'}</div>`}).join('');byId('grid').innerHTML=html;byId('mobile').innerHTML=days.map((name,i)=>{let list=courses.filter(c=>c.day===i).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="mobile-day"><div class="dayhead"><span>${name} <span class="hint">${addDays(mon,i).getMonth()+1}/${addDays(mon,i).getDate()}</span></span><button class="add-day" data-add="${i}" aria-label="${name}添加课程">＋</button></div>${list.map(c=>{let [a,b]=color(c.grade);return `<button class="event" data-id="${esc(c.id)}" style="--accent:${a};--bg:${b}"><span>${esc(c.start)} — ${esc(c.end)}</span><b>${esc(c.grade)}${c.name?' · '+esc(c.name):''}</b><span>${esc(c.notes||'点击查看或编辑')}</span></button>`}).join('')||'<div class="none">暂无课程</div>'}</div>`}).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(null,Number(b.dataset.add)));document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openForm(courses.find(c=>c.id===b.dataset.id)));persist()}function timeOptions(){for(let k of ['start-hour','end-hour'])byId(k).innerHTML=Array.from({length:24},(_,i)=>`<option value="${pad(i)}">${pad(i)} 时</option>`).join('');for(let k of ['start-minute','end-minute'])byId(k).innerHTML=Array.from({length:60},(_,i)=>`<option value="${pad(i)}">${pad(i)} 分</option>`).join('');byId('day').innerHTML=days.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}function openForm(c,day=0){editing=c?.id||null;byId('dialog-title').textContent=c?'编辑课程':'添加课程';byId('day').value=String(c?.day??day);byId('grade').value=c?.grade||'';byId('name').value=c?.name||'';byId('notes').value=c?.notes||'';let [sh,sm]=(c?.start||'18:00').split(':'),[eh,em]=(c?.end||'20:00').split(':');byId('start-hour').value=sh;byId('start-minute').value=sm;byId('end-hour').value=eh;byId('end-minute').value=em;byId('delete').hidden=!c;byId('form-error').textContent='';byId('dialog').showModal()}byId('form').onsubmit=e=>{e.preventDefault();let c={id:editing||uid(),day:Number(byId('day').value),grade:byId('grade').value,name:byId('name').value.trim(),notes:byId('notes').value.trim(),start:byId('start-hour').value+':'+byId('start-minute').value,end:byId('end-hour').value+':'+byId('end-minute').value};if(!valid(c)){byId('form-error').textContent='请选择年级，且结束时间必须晚于开始时间（不支持跨午夜）。';return}if(editing)courses=courses.map(x=>x.id===editing?c:x);else courses.push(c);byId('dialog').close();render()};byId('add').onclick=()=>openForm();byId('close').onclick=()=>byId('dialog').close();byId('cancel').onclick=()=>byId('dialog').close();byId('delete').onclick=()=>{courses=courses.filter(c=>c.id!==editing);byId('dialog').close();render()};['start-date','end-date','repeat'].forEach(id=>byId(id).onchange=render);function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}byId('save-json').onclick=()=>download('课程表.json',JSON.stringify({version:1,startDate:byId('start-date').value,endDate:byId('end-date').value,repeat:byId('repeat').checked,courses},null,2),'application/json;charset=utf-8');byId('load').onclick=()=>byId('file').click();byId('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>1024*1024)throw Error('文件超过 1 MB');let obj=JSON.parse(await file.text()),arr=Array.isArray(obj)?obj:obj.courses;if(!Array.isArray(arr)||arr.length>1000||!arr.every(valid)||new Set(arr.map(c=>c.id)).size!==arr.length)throw Error('JSON 格式不正确，请使用本页面导出的文件');if(!Array.isArray(obj)){if(obj.startDate&&!parseDate(obj.startDate))throw Error('开始日期无效');if(obj.endDate&&!parseDate(obj.endDate))throw Error('结束日期无效');if(obj.repeat!==undefined&&typeof obj.repeat!=='boolean')throw Error('重复设置无效')}if(courses.length&&!confirm('导入将替换当前课表。建议先导出 JSON 备份，继续吗？'))return;courses=arr.map(c=>({id:c.id,day:c.day,grade:c.grade,name:c.name,notes:c.notes,start:c.start,end:c.end}));if(obj.startDate)byId('start-date').value=obj.startDate;byId('end-date').value=obj.endDate||'';byId('repeat').checked=!!obj.repeat;byId('message').textContent=`已导入 ${courses.length} 节课程。`;render()}catch(err){byId('message').textContent='导入失败：'+err.message}finally{e.target.value=''}};function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}function utc(dateValue,time){let d=parseDate(dateValue),[h,m]=time.split(':').map(Number);return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),h-8,m)).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}function fold(line){let enc=new TextEncoder(),out='',n=0;for(const ch of line){let size=enc.encode(ch).length;if(n+size>75){out+='\r\n ';n=1}out+=ch;n+=size}return out}byId('export-ics').onclick=()=>{if(!courses.length){byId('message').textContent='请先添加课程。';return}let start=parseDate(byId('start-date').value),end=byId('end-date').value?parseDate(byId('end-date').value):null,repeat=byId('repeat').checked;if(!start||byId('end-date').value&&!end){byId('message').textContent='请选择有效日期。';return}let mon=monday(start);if(repeat&&end&&end<mon){byId('message').textContent='重复结束日期不能早于所选周。';return}let now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kejian//Weekly Planner//ZH','CALSCALE:GREGORIAN'];let included=0;for(const c of courses){let d=addDays(mon,c.day);if(repeat&&end&&d>end)continue;included++;out.push('BEGIN:VEVENT','UID:'+icsEsc(c.id)+'@kejian.local','DTSTAMP:'+now,'DTSTART:'+utc(localKey(d),c.start),'DTEND:'+utc(localKey(d),c.end),'SUMMARY:'+icsEsc(c.grade+(c.name?' · '+c.name:'')),'DESCRIPTION:'+icsEsc(c.notes));if(repeat)out.push('RRULE:FREQ=WEEKLY'+(end?';UNTIL='+utc(localKey(end),'23:59'):''));out.push('END:VEVENT')}if(!included){byId('message').textContent='结束日期早于本周所有课程，请调整日期。';return}out.push('END:VCALENDAR');download('课间课程表.ics',out.map(fold).join('\r\n')+'\r\n','text/calendar;charset=utf-8');byId('message').textContent=`已生成 ${included} 节课程的日历文件；请在 Apple Calendar 中打开并选择要导入的日历。`};timeOptions();let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(saved&&Array.isArray(saved.courses)&&saved.courses.every(valid)){courses=saved.courses;byId('start-date').value=parseDate(saved.startDate)?saved.startDate:localKey(new Date());byId('end-date').value=parseDate(saved.endDate)?saved.endDate:'';byId('repeat').checked=!!saved.repeat}else byId('start-date').value=localKey(new Date());render();
</script></body></html>
