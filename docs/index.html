<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课间 · 家教工作台预览</title></head><body><style>
:root{--ink:#202d2c;--muted:#74837d;--green:#295e4e;--line:#e6ede8;--bg:#f6f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:750;letter-spacing:2px;color:#244a3d}.brand small{display:block;font-size:11px;color:#a3aea6;letter-spacing:1px;margin-top:5px}.nav{display:grid;gap:6px;margin-top:44px}.nav button{border:0;background:none;text-align:left;padding:12px 14px;border-radius:9px;color:#697970;font:inherit;cursor:pointer}.nav button.active{color:#245b49;background:#eaf3ed;font-weight:650}.sidefoot{margin-top:auto;color:#9ca9a0;font-size:12px}.main{padding:32px clamp(22px,4vw,64px);min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:12px;color:#819289}.top h1{font-size:26px;margin:7px 0 0;letter-spacing:-1px}.pill{background:#fff;border:1px solid var(--line);border-radius:100px;padding:9px 14px;color:#5c7065}.banner{margin:22px 0;background:#fff6df;color:#775b22;border-radius:10px;padding:12px 15px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.metric label{color:#87958b;font-size:12px}.metric strong{display:block;margin-top:12px;font-size:22px}.metric span{color:#87958b;font-size:12px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 14px}.heading h2{font-size:17px;margin:0}.controls{display:flex;gap:6px;align-items:center}.btn{border:1px solid #e0e9e2;background:white;border-radius:8px;padding:8px 12px;color:#546a5d;cursor:pointer;font:inherit}.btn.primary{background:#315f4c;color:#fff;border-color:#315f4c}.grid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px}.day{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:180px;padding:12px}.day.today{border-color:#94b6a0}.dayhead{font-weight:650}.dayhead span{display:block;margin-top:4px;font-size:12px;color:#a0aea3}.lesson{width:100%;display:block;border:0;text-align:left;margin-top:12px;background:#edf5ef;border-left:3px solid #6a9d7b;border-radius:5px;padding:9px;color:#2f5944;cursor:pointer}.lesson b,.lesson small{display:block;overflow:hidden;text-overflow:ellipsis}.lesson small{margin-top:5px;color:#6a8872}.emptyday{color:#c6d0c8;font-size:12px;margin-top:25px}.panel{margin-top:15px}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #f0f3f0}.row:last-child{border:0}.tag{font-size:12px;color:#678c73}.hint{color:#87958b;font-size:12px}.modal{position:fixed;inset:0;background:#15241b88;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.dialog{background:#fff;border-radius:16px;padding:24px;width:min(480px,100%)}.dialog input{width:100%;padding:10px;border:1px solid #dce5df;border-radius:8px;margin:5px 0 14px}.error{color:#b44339}.mobile-nav{display:none}@media(max-width:800px){.app{display:block}.sidebar{display:none}.main{padding:22px 16px 85px}.top h1{font-size:23px}.metrics{gap:8px}.metric{padding:14px}.metric strong{font-size:17px}.calendar-scroll{overflow-x:auto}.grid{min-width:760px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:12px}.mobile-nav button{border:0;background:none;color:#315f4c}.sidefoot{display:none}}
</style><div class="app"><aside class="sidebar"><div class="brand">课间<small>TUTOR WORKSPACE</small></div><nav class="nav"><button class="active" data-view="calendar">▦　课程表</button><button data-view="history">☰　历史课程</button></nav><div class="sidefoot">家教工作台 · 课程与记录</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="subtitle">课程安排</div><h1 id="title">教师工作台</h1></div><div class="pill" id="role">教师视角</div></header><div class="banner" id="banner" hidden>静态界面预览 · 虚构示例数据，未连接 Frappe 后台；修改不会保存</div><section class="metrics"><div class="metric"><label>下一节课</label><strong id="next">—</strong><span id="nextdetail">暂无安排</span></div><div class="metric"><label>本周课程</label><strong id="weekcount">—</strong><span>按课程开始时间统计</span></div><div class="metric"><label>已完成课程</label><strong id="completed">—</strong><span>当前已加载课程</span></div></section><section id="calendar"><div class="heading"><div><h2>周课程表</h2><div class="hint" id="range"></div></div><div class="controls"><button class="btn" id="prev" aria-label="上一周">←</button><button class="btn" id="today">本周</button><button class="btn" id="nextweek" aria-label="下一周">→</button></div></div><div class="calendar-scroll"><div class="grid" id="week"></div></div></section><section id="history" hidden><div class="heading"><h2>历史课程</h2><span class="hint">已完成的课程及课堂总结</span></div><div class="panel" id="history-list"></div></section><div class="panel"><div class="heading" style="margin:0 0 4px"><h2>即将开始</h2><span class="hint">点击课程查看详情</span></div><div id="upcoming"></div></div><p class="hint" id="message" role="status"></p></main></div><div class="mobile-nav"><button data-view="calendar">课程表</button><button data-view="history">历史课程</button></div><div class="modal" id="modal" hidden><div class="dialog"><div class="heading" style="margin:0 0 15px"><h2>课程详情</h2><button class="btn" id="close">关闭</button></div><div id="detail"></div><form id="reschedule" hidden><label>调整开始时间<input name="start" type="datetime-local" required></label><label>调整结束时间<input name="end" type="datetime-local" required></label><label>调课原因（选填）<input name="reason" maxlength="200"></label><button class="btn primary" type="submit">保存单次调课</button><p class="hint">仅修改这一次课程，不影响后续周期课。</p></form><p class="error" id="form-error"></p></div></div><script>window.TUTOR_BOOT={"role": "Teacher", "preview": true, "lessons": [{"name": "1", "student": "示例学生", "teacher": "示例教师", "course": "数学 · 一次函数", "starts_at": "2026-10-27 18:00:00", "ends_at": "2026-10-27 20:00:00", "status": "Scheduled", "summaries": ["复习了本节课的重点题型。"]}, {"name": "3", "student": "示例学生", "teacher": "示例教师", "course": "数学 · 整式运算", "starts_at": "2026-10-29 16:00:00", "ends_at": "2026-10-29 18:00:00", "status": "Scheduled", "summaries": ["复习了本节课的重点题型。"]}, {"name": "-3", "student": "示例学生", "teacher": "示例教师", "course": "数学 · 三角形", "starts_at": "2026-10-23 19:00:00", "ends_at": "2026-10-23 21:00:00", "status": "Completed", "summaries": ["复习了本节课的重点题型。"]}]};</script><script>
const $=id=>document.getElementById(id);let rows=[],currentWeek=monday(new Date()),selected=null;const state=window.TUTOR_BOOT;let role=state.role;function escapeHtml(v){const n=document.createElement('span');n.textContent=v??'';return n.innerHTML}function dt(s){return new Date(String(s).replace(' ','T'))}function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function dayOffset(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function shortTime(s){const d=dt(s);return Number.isNaN(d.valueOf())?'—':d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}function status(s){return ({Scheduled:'待上课',Completed:'已完成',Cancelled:'已取消'})[s]||s}function goView(view){$('calendar').hidden=view!=='calendar';$('history').hidden=view!=='history';document.querySelectorAll('.nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>goView(b.dataset.view));function render(){let today=new Date(), end=dayOffset(currentWeek,7),weekRows=rows.filter(x=>dt(x.starts_at)>=currentWeek&&dt(x.starts_at)<end),future=rows.filter(x=>x.status==='Scheduled'&&dt(x.starts_at)>=today).sort((a,b)=>dt(a.starts_at)-dt(b.starts_at));$('title').textContent=role==='Teacher'?'教师工作台':'学生课程';$('role').textContent=role==='Teacher'?'教师视角':'学生视角';$('next').textContent=future.length?dateKey(dt(future[0].starts_at)).slice(5):'暂无';$('nextdetail').textContent=future.length?shortTime(future[0].starts_at)+' · '+future[0].course:'暂无安排';$('weekcount').textContent=weekRows.length+' 节';$('completed').textContent=rows.filter(x=>x.status==='Completed').length+' 节';$('range').textContent=dateKey(currentWeek)+' 至 '+dateKey(dayOffset(currentWeek,6));$('week').innerHTML=Array.from({length:7},(_,i)=>{let day=dayOffset(currentWeek,i),items=weekRows.filter(x=>dateKey(dt(x.starts_at))===dateKey(day));return `<div class="day ${dateKey(day)===dateKey(today)?'today':''}"><div class="dayhead">${['周一','周二','周三','周四','周五','周六','周日'][i]}<span>${day.getMonth()+1}月${day.getDate()}日</span></div>${items.map(x=>`<button class="lesson" data-lesson="${escapeHtml(x.name)}"><b>${escapeHtml(shortTime(x.starts_at))} · ${escapeHtml(x.course)}</b><small>${escapeHtml(role==='Teacher'?x.student:x.teacher)}</small></button>`).join('')||'<div class="emptyday">暂无课程</div>'}</div>`}).join('');$('upcoming').innerHTML=future.slice(0,4).map(x=>`<div class="row"><div><b>${escapeHtml(x.course)}</b><div class="hint">${escapeHtml(dateKey(dt(x.starts_at)))} ${escapeHtml(shortTime(x.starts_at))} · ${escapeHtml(role==='Teacher'?x.student:x.teacher)}</div></div><button class="btn" data-lesson="${escapeHtml(x.name)}">详情</button></div>`).join('')||'<p class="hint">暂无即将开始的课程</p>';$('history-list').innerHTML=rows.filter(x=>x.status==='Completed').map(x=>`<div class="row"><div><b>${escapeHtml(x.course)}</b><div class="hint">${escapeHtml(x.starts_at)} · ${escapeHtml(role==='Teacher'?x.student:x.teacher)}</div>${role==='Student'?(x.summaries||[]).map(s=>`<p>${escapeHtml(s)}</p>`).join(''):''}</div><span class="tag">已完成</span></div>`).join('')||'<p class="hint">暂无历史课程</p>';document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson))}function openLesson(id){selected=rows.find(x=>x.name===id);if(!selected)return;$('detail').innerHTML=`<p><b>${escapeHtml(selected.course)}</b> <span class="tag">${escapeHtml(status(selected.status))}</span></p><p>${escapeHtml(selected.starts_at)} — ${escapeHtml(selected.ends_at)}</p><p class="hint">${role==='Teacher'?'学生':'教师'}：${escapeHtml(role==='Teacher'?selected.student:selected.teacher)}</p>`;$('reschedule').hidden=role!=='Teacher'||selected.status!=='Scheduled';$('form-error').textContent='';$('modal').hidden=false}$('close').onclick=()=>$('modal').hidden=true;$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').hidden=true};$('prev').onclick=()=>{currentWeek=dayOffset(currentWeek,-7);render()};$('nextweek').onclick=()=>{currentWeek=dayOffset(currentWeek,7);render()};$('today').onclick=()=>{currentWeek=monday(new Date());render()};$('reschedule').onsubmit=async e=>{e.preventDefault();if(state.preview){$('form-error').textContent='静态预览不能保存修改';return}let f=e.currentTarget,button=f.querySelector('button'),data=new URLSearchParams({lesson:selected.name,starts_at:f.elements.start.value.replace('T',' '),ends_at:f.elements.end.value.replace('T',' '),reason:f.elements.reason.value});button.disabled=true;try{let r=await fetch('/api/method/tutor_core.portal.reschedule',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Frappe-CSRF-Token':state.csrf},body:data});if(!r.ok)throw Error('调课失败，请检查时间或权限');$('modal').hidden=true;await load();$('message').textContent='调课已保存'}catch(err){$('form-error').textContent=err.message}finally{button.disabled=false}};async function load(){if(state.preview){rows=state.lessons;render();return}let r=await fetch('/api/method/tutor_core.portal.lessons',{credentials:'same-origin'});if(!r.ok)throw Error('课程加载失败，请刷新或重新登录');let data=(await r.json()).message;role=data.kind;rows=data.lessons;render()}if(state.preview){$('banner').hidden=false;let toggle=document.createElement('button');toggle.className='btn';toggle.textContent='切换教师 / 学生';toggle.onclick=()=>{role=role==='Teacher'?'Student':'Teacher';render()};$('banner').append('　',toggle)}load().catch(e=>$('message').textContent=e.message);
</script></body></html>
