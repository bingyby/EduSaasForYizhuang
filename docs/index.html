<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课间 · 家教工作台预览</title><style>:root{--ink:#142d2b;--green:#164d3a;--paper:#f8f8f5;--line:#e0e5df;--muted:#778681;--sage:#40875a;--blue:#4c8dd1;--rust:#c66244}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:14px}.shell{display:grid;grid-template-columns:186px minmax(0,1fr);min-height:100vh}aside{border-right:1px solid var(--line);padding:27px 14px;display:flex;flex-direction:column;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #3a8e70;outline-offset:2px}.logo{font-size:30px;font-weight:760;color:var(--green);padding:0 12px;letter-spacing:2px}.logo small{font-size:9px;letter-spacing:2px;color:#677c72;display:block;margin-top:1px}.sidebar-nav{margin-top:56px;display:grid;gap:7px}.nav-btn{border:0;border-radius:3px;background:transparent;text-align:left;padding:13px 14px;color:#405651;font-size:15px}.nav-btn:hover,.nav-btn.active{background:#e5eee6;color:var(--green);font-weight:650}.nav-icon{display:inline-block;width:30px;font-size:19px}.side-bottom{margin-top:auto}.main{padding:27px 38px 32px;min-width:0}.banner{background:#fff1ce;color:#755817;padding:9px 14px;margin-bottom:18px;font-size:12px;border-left:3px solid #c28c28}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:24px;border-bottom:1px solid var(--line)}h1{font-size:38px;letter-spacing:-1.5px;margin:0;line-height:1.1}h2{font-size:20px;margin:0}h3{font-size:17px;margin:0}.sub{font-size:16px;margin-top:9px;color:#435a52}.actions,.toolbar,.legend,.view-toggle{display:flex;align-items:center;gap:9px}.button{background:transparent;border:1px solid #d6dfd9;border-radius:3px;padding:10px 13px;color:#21463b}.button:hover{background:#edf2ed}.button.primary{background:var(--green);border-color:var(--green);color:#fff}.button.active{background:var(--green);color:white;border-color:var(--green)}.avatar{display:inline-grid;place-items:center;background:#24543e;color:white;width:38px;height:38px;border-radius:2px;font-size:17px;flex:none}.identity{position:relative}.popover{position:absolute;z-index:5;right:0;top:48px;width:290px;background:#fbfcfa;border:1px solid #cfdad2;padding:16px}.popover[hidden]{display:none}.popover h3{font-size:16px}.popover p{color:var(--muted);font-size:12px;margin:12px 0}.popover .button{width:100%;margin-top:8px}.calendar-top{padding:22px 0 14px;display:flex;justify-content:space-between;gap:18px;align-items:center}.period{font-size:20px;font-weight:700}.range{padding-left:16px;border-left:1px solid var(--line);margin-left:8px;font-size:15px}.meta{color:#51665d}.calendar-controls{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:5px 0 18px;flex-wrap:wrap}.legend{gap:20px}.legend span{white-space:nowrap}.dot{width:10px;height:10px;display:inline-block;margin-right:6px;border-radius:2px}.calendar-scroll{overflow:auto;border:1px solid var(--line)}.week-grid{min-width:800px;display:grid;grid-template-columns:65px repeat(7,minmax(105px,1fr));position:relative}.corner,.dayhead{height:70px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.dayhead{text-align:center;padding:13px;color:#52625f}.dayhead strong{font-size:18px;display:block;margin-top:5px;color:var(--ink)}.dayhead.current strong{display:inline-block;border-bottom:2px solid var(--green);padding-bottom:4px}.timecol{position:relative;height:1080px;border-right:1px solid var(--line)}.time-label{position:absolute;right:10px;color:#7d8d87;font-size:12px;transform:translateY(-50%)}.daycol{height:1080px;position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 71px,#e5eae4 71px,#e5eae4 72px)}.event{position:absolute;left:3px;right:3px;border:0;border-left:4px solid var(--accent);background:var(--tint);text-align:left;border-radius:2px;padding:8px 9px;overflow:hidden}.event b,.event span{display:block;line-height:1.45}.event span{font-size:12px}.event b{margin:3px 0}.event:hover{filter:brightness(.97)}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(80px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}.month-cell{min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px}.month-cell button{display:block;width:100%;text-align:left;margin-top:5px;border:0;border-left:3px solid var(--accent);background:var(--tint);padding:4px;overflow:hidden}.section{margin-top:28px}.list-row{display:flex;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.list-row .grow{flex:1}.quiet{color:var(--muted);font-size:13px}.empty{padding:35px 0;color:var(--muted)}.back{border:0;background:none;padding:0;color:#668077}.detail-hero{display:flex;justify-content:space-between;gap:22px;align-items:center;padding:35px 0;border-bottom:1px solid var(--line)}.detail-title{font-size:31px;font-weight:750;border-left:5px solid #7c9ab7;padding-left:18px}.detail-time{font-size:24px;font-weight:700}.detail-meta{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);padding:22px 0;gap:20px}.detail-meta span{display:block;color:var(--muted);margin-bottom:8px}.detail-body{display:grid;grid-template-columns:1.4fr 1fr;gap:36px;padding-top:25px}.detail-side{border-left:1px solid var(--line);padding-left:32px}.form-label{display:block;color:#718078;font-size:13px;margin:15px 0 6px}.field{width:100%;border:1px solid #d0d9d2;background:#fff;padding:10px;border-radius:2px;color:var(--ink)}.field-row{display:flex;gap:10px}.field-row>div{flex:1}.notice{margin:20px 0;color:#52665c;border-left:3px solid var(--green);padding-left:12px;line-height:1.6}.error{color:#ae4238}.role-switch{border:0;background:transparent;color:var(--green);padding:6px}.mobile-nav{display:none}.agenda{display:none}.hidden{display:none!important}@media(max-width:800px){.shell{display:block}aside{display:none}.main{padding:20px 18px 95px}.topbar{padding-bottom:18px}h1{font-size:30px}.sub{font-size:14px}.actions{gap:5px}.actions .schedule-btn{display:none}.avatar{width:34px;height:34px}.calendar-top{display:block}.period{font-size:17px}.range{display:inline-block}.meta{display:block;margin-top:14px}.calendar-controls{gap:14px}.legend{gap:12px;font-size:12px}.calendar-scroll{display:none}.agenda{display:block}.agenda-row{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:21px 0;border-bottom:1px solid var(--line)}.agenda-event{border:0;border-left:4px solid var(--accent);background:transparent;text-align:left;padding:0 0 0 15px}.agenda-event strong,.agenda-event span{display:block;line-height:1.6}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fbfcfa;border-top:1px solid var(--line);justify-content:space-around;padding:13px 5px;z-index:3}.mobile-nav button{border:0;background:transparent;color:#52675f}.mobile-nav button.active{color:var(--green);font-weight:700}.detail-hero{display:block}.detail-time{font-size:19px;margin-top:16px}.detail-title{font-size:24px}.detail-meta{grid-template-columns:1fr 1fr}.detail-body{display:block}.detail-side{border:0;border-top:1px solid var(--line);padding:24px 0}.popover{right:-40px}.month-grid{min-width:700px}.month-scroll{overflow-x:auto}}
</style></head><body><div class="shell"><aside><div class="logo">课间<small>TUTOR WORKSPACE</small></div><nav class="sidebar-nav" id="nav"></nav><div class="side-bottom"><button class="nav-btn" data-view="settings"><span class="nav-icon">⚙</span>设置</button></div></aside><main class="main"><div id="banner" class="banner" hidden>静态界面预览 · 全部数据为示例，未连接 Frappe；演示操作不会保存。 <button class="role-switch" id="switch-role">切换教师 / 学生</button></div><div id="app"></div></main></div><nav class="mobile-nav" id="mobile-nav"></nav>
<script>window.TUTOR_BOOT={"role": "Teacher", "preview": true};</script><script>(()=>{'use strict';const boot=window.TUTOR_BOOT;let role=boot.role,rows=[],view='calendar',mode='week',week=monday(new Date()),selected=null;const $=s=>document.querySelector(s);const esc=v=>{let d=document.createElement('span');d.textContent=v==null?'':String(v);return d.innerHTML};function date(v){return new Date(String(v).replace(' ','T'))}function key(d){return [d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-')}function pad(n){return String(n).padStart(2,'0')}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function time(v){let d=date(v);return pad(d.getHours())+':'+pad(d.getMinutes())}function fmt(d){return (d.getMonth()+1)+'月'+d.getDate()+'日'}function duration(x){return Math.max(0,(date(x.ends_at)-date(x.starts_at))/3600000)}const status={Scheduled:'待上课',Completed:'已完成',Cancelled:'已取消'};const colors=[['#40875a','#e6f1e7'],['#4c8dd1','#e5f0fa'],['#c66244','#f8eae3'],['#73857c','#edf1ed']];function color(x){if(boot.preview){if(role==='Teacher')return colors[{'初一':0,'初二':1,'初三':2}[x.grade]??3];return colors[{'数学':0,'英语':1,'物理':2}[x.subject]??3]}return colors[3]}function person(x){return role==='Teacher'?x.student:x.teacher}function type(x){return boot.preview?(x.class_type||'一对一'):'一对一'}function title(x){return x.course||'课程'}function notice(msg){let m=$('#message');if(m)m.textContent=msg}function initNav(){let a=role==='Teacher'?[['home','⌂','工作台'],['calendar','▦','课程表'],['students','♙','学生'],['history','▤','历史课程'],['settlement','▥','结算']]:[['home','⌂','工作台'],['calendar','▦','我的课程'],['history','▤','学习记录'],['settings','♙','我的']];$('#nav').innerHTML=a.map(([id,icon,label])=>`<button class="nav-btn ${view===id?'active':''}" data-view="${id}"><span class="nav-icon">${icon}</span>${label}</button>`).join('');let m=role==='Teacher'?[['calendar','课表'],['students','学生'],['settings','我的']]:[['calendar','课程'],['history','记录'],['settings','我的']];$('#mobile-nav').innerHTML=m.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}">${label}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}function head(label,sub){return `<header class="topbar"><div><h1>${label}</h1><div class="sub">${sub}</div></div><div class="actions"><div class="identity"><button class="button" id="export">⇩　导出到 Calendar</button><div class="popover" id="export-pop" hidden><h3>导出课程表</h3><p>导出当前显示周或月的课程快照</p><button class="button primary" id="export-ics">⇩　一键导出 .ics</button><p>Apple Calendar / Google / Outlook</p><p>下载后不会随系统中的调课自动更新。</p></div></div>${role==='Teacher'?'<button class="button primary schedule-btn" id="schedule">＋　安排课程</button>':''}<div class="identity"><button class="button" id="account"><span class="avatar">${role==='Teacher'?'林':'陈'}</span>　⌄</button><div class="popover" id="account-pop" hidden><b>${role==='Teacher'?'教师':'学生'}工作台</b><button class="button" id="account-settings">账号与身份</button>${boot.preview?'<button class="button" id="role-toggle">切换演示身份</button>':'<p>身份由当前登录账号决定。</p>'}</div></div></div></header>`}function getScope(){let end=mode==='week'?add(week,7):new Date(week.getFullYear(),week.getMonth()+1,1),start=mode==='week'?week:new Date(week.getFullYear(),week.getMonth(),1);return rows.filter(x=>date(x.starts_at)>=start&&date(x.starts_at)<end)}function weekCalendar(){let all=getScope(),firstHour=all.length?Math.min(14,...all.map(x=>date(x.starts_at).getHours())):14,lastHour=all.length?Math.min(24,Math.max(23,...all.map(x=>Math.ceil(date(x.ends_at).getHours()+date(x.ends_at).getMinutes()/60)))):23,gridHeight=(lastHour-firstHour)*72,html='<div class="week-grid"><div class="corner"></div>';for(let i=0;i<7;i++){let d=add(week,i);html+=`<div class="dayhead ${key(d)===key(new Date())?'current':''}">${['周一','周二','周三','周四','周五','周六','周日'][i]}<strong>${d.getDate()}</strong></div>`}html+=`<div class="timecol" style="height:${gridHeight}px">`;for(let h=firstHour;h<=lastHour;h++)html+=`<span class="time-label" style="top:${(h-firstHour)*72}px">${pad(h)}:00</span>`;html+='</div>';for(let i=0;i<7;i++){let d=add(week,i);html+=`<div class="daycol" style="height:${gridHeight}px">`;for(const x of all.filter(x=>key(date(x.starts_at))===key(d))){let start=date(x.starts_at),mins=start.getHours()*60+start.getMinutes(),top=(mins-firstHour*60)*72/60,height=duration(x)*72,[c,bg]=color(x);if(top<0||top+height>gridHeight)continue;html+=`<button class="event" data-lesson="${esc(x.name)}" style="top:${top}px;height:${Math.max(34,height)}px;--accent:${c};--tint:${bg}"><span>${esc(time(x.starts_at))} – ${esc(time(x.ends_at))}</span><b>${esc(title(x))}</b><span>${esc(type(x))}</span><span>${esc(person(x))}</span></button>`}html+='</div>'}return html+'</div>'}function monthCalendar(){let first=new Date(week.getFullYear(),week.getMonth(),1),m=monday(first),html='<div class="month-scroll"><div class="month-grid">';for(let i=0;i<42;i++){let d=add(m,i),events=rows.filter(x=>key(date(x.starts_at))===key(d));html+=`<div class="month-cell"><b>${d.getDate()}</b>${events.map(x=>{let [c,b]=color(x);return `<button data-lesson="${esc(x.name)}" style="--accent:${c};--tint:${b}">${esc(time(x.starts_at))} ${esc(title(x))}</button>`}).join('')}</div>`}return html+'</div></div>'}function agenda(){let list=getScope().sort((a,b)=>date(a.starts_at)-date(b.starts_at));return list.map(x=>{let d=date(x.starts_at),[c]=color(x);return `<div class="agenda-row"><div><b>周${'日一二三四五六'[d.getDay()]}</b><div class="quiet">${d.getMonth()+1}/${d.getDate()}</div></div><button class="agenda-event" data-lesson="${esc(x.name)}" style="--accent:${c}"><span>${esc(time(x.starts_at))} — ${esc(time(x.ends_at))}</span><strong>${esc(title(x))}</strong><span>${esc(type(x))} · ${esc(person(x))}</span></button></div>`}).join('')||'<div class="empty">这段时间暂无课程</div>'}function lessonEvents(){document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{selected=rows.find(x=>x.name===b.dataset.lesson);view='detail';render()})}function calendar(){let sub=boot.preview?(role==='Teacher'?'林老师 · 数学':'陈予 · 初二'):(role==='Teacher'?'教师课程':'学生课程');let scope=getScope(),hours=scope.reduce((s,x)=>s+duration(x),0);let legend=role==='Teacher'?['初一','初二','初三']:['数学','英语','物理'];let prefix=mode==='week'?`${fmt(week)} — ${fmt(add(week,6))}`:`${week.getFullYear()}年${week.getMonth()+1}月`;return `${head(role==='Teacher'?'课程表':'我的课程',sub)}<div class="calendar-top"><div><span class="period">${week.getFullYear()}年${week.getMonth()+1}月</span><span class="range">${prefix}</span></div><span class="meta">${mode==='week'?'本周':'本月'} ${scope.length} 节 / ${Number(hours.toFixed(1))} 小时</span></div><div class="calendar-controls"><div class="legend">${boot.preview?legend.map((x,i)=>`<span><i class="dot" style="background:${colors[i][0]}"></i>${x}</span>`).join(''):'<span class="quiet">颜色信息尚未配置</span>'}</div><div class="toolbar"><button class="button" id="prev" aria-label="上一段">←</button><button class="button" id="today">本周</button><button class="button" id="next" aria-label="下一段">→</button><div class="view-toggle"><button class="button ${mode==='week'?'active':''}" id="week-mode">周</button><button class="button ${mode==='month'?'active':''}" id="month-mode">月</button></div></div></div><div class="calendar-scroll">${mode==='week'?weekCalendar():monthCalendar()}</div><div class="agenda">${agenda()}</div><p class="quiet">时间按当前浏览器时区显示</p><p id="message" class="quiet" role="status"></p>`}function detail(){let x=selected;if(!x){view='calendar';return calendar()}let edit=role==='Teacher'&&x.status==='Scheduled';return `${head('课程详情','课程表 / 课程详情')}<div class="section"><button class="back" id="back">← 返回课程表</button><div class="detail-hero"><div class="detail-title">${esc(title(x))}<div class="sub">${esc(type(x))}${boot.preview&&x.class_count>1?' · '+esc(x.class_count)+'人':''}</div></div><div class="detail-time">${esc(fmt(date(x.starts_at)))}<br>${esc(time(x.starts_at))} — ${esc(time(x.ends_at))} <span class="quiet">${duration(x)} 小时</span></div></div><div class="detail-meta"><div><span>授课教师</span>${esc(x.teacher)}</div><div><span>学生</span>${esc(x.student)}</div><div><span>课程</span>${esc(title(x))}</div><div><span>状态</span>${esc(status[x.status]||x.status)}</div></div><div class="detail-body"><div><h2>授课学生</h2>${String(x.student).split("、").map(name=>`<div class="list-row"><span class="avatar">${esc(name.slice(0,1))}</span><div class="grow"><b>${esc(name)}</b><p class="quiet">${esc(type(x))}</p></div><span>${duration(x)} 小时</span></div>`).join("")}<div class="section"><h2>课堂记录</h2>${(x.summaries||[]).map(s=>`<p>${esc(s)}</p>`).join('')||'<p class="quiet">暂无课堂总结</p>'}</div></div><div class="detail-side"><h2>课程安排</h2><p class="quiet">课程时间</p><p>${esc(x.starts_at)} — ${esc(x.ends_at)}</p>${edit?`<div class="section"><h2>本次调课</h2><form id="reschedule"><label class="form-label" for="start">开始时间</label><input class="field" id="start" name="start" type="datetime-local" required value="${esc(String(x.starts_at).slice(0,16).replace(' ','T'))}"><label class="form-label" for="end">结束时间</label><input class="field" id="end" name="end" type="datetime-local" required value="${esc(String(x.ends_at).slice(0,16).replace(' ','T'))}"><label class="form-label" for="reason">调课原因</label><input class="field" id="reason" name="reason" maxlength="200" placeholder="选填"><div class="notice">仅修改这一次课程，不影响后续周期课。</div><button class="button primary" type="submit">保存单次调课</button><p class="error" id="form-error" role="alert"></p></form></div>`:''}</div></div></div>`}function history(){let done=rows.filter(x=>x.status==='Completed');return `${head(role==='Teacher'?'历史课程':'学习记录','查看已完成课程与课堂总结')}<div class="section">${done.map(x=>`<div class="list-row"><div class="grow"><b>${esc(title(x))}</b><p class="quiet">${esc(x.starts_at)} · ${esc(person(x))}</p>${(x.summaries||[]).map(s=>`<p>${esc(s)}</p>`).join('')}</div><span class="quiet">已完成</span><button class="button" data-lesson="${esc(x.name)}">详情</button></div>`).join('')||'<div class="empty">暂无历史课程</div>'}</div>`}function students(){let list=[...new Set(rows.map(x=>x.student))];return `${head('学生','查看负责的学生及课程')}<div class="section">${list.map(name=>`<div class="list-row"><span class="avatar">${esc(String(name).slice(0,1))}</span><div class="grow"><b>${esc(name)}</b><p class="quiet">${rows.filter(x=>x.student===name).length} 节已加载课程</p></div></div>`).join('')||'<div class="empty">暂无学生</div>'}<p class="quiet">学生档案详情仍在开发。</p></div>`}function settings(){return `${head('账号与身份','设置 / 账号与身份')}<div class="detail-hero"><span class="avatar" style="width:75px;height:75px;font-size:28px">${role==='Teacher'?'林':'陈'}</span><div class="grow"><h2>${boot.preview?(role==='Teacher'?'林老师':'陈予'):(role==='Teacher'?'教师':'学生')}</h2><p class="quiet">${role==='Teacher'?'教师工作台':'学生课程'}</p></div></div><div class="detail-body"><div><h2>当前身份</h2><p class="quiet">${boot.preview?'点击切换演示视角，实际账号需授权。':'当前身份由服务器验证，不可在页面自助赋权。'}</p>${boot.preview?'<button class="button" id="demo-switch">切换教师 / 学生演示</button>':''}</div><div class="detail-side"><h2>偏好设置</h2><div class="list-row"><span class="grow">时区</span><span>浏览器本地时间</span></div><p class="quiet">账户管理、提醒与绑定功能尚未接入。</p></div></div>`}function settlement(){return `${head('课时与结算','查看课程收入与结算')}<div class="section"><h2>结算记录</h2><div class="empty">当前页面尚未接入结算数据。</div></div>`}function home(){let future=rows.filter(x=>x.status==='Scheduled'&&date(x.starts_at)>=new Date()).sort((a,b)=>date(a.starts_at)-date(b.starts_at));return `${head('工作台','课程与学习记录')}<div class="section"><h2>接下来的课程</h2>${future.slice(0,5).map(x=>`<div class="list-row"><div class="grow"><b>${esc(title(x))}</b><p class="quiet">${esc(x.starts_at)} · ${esc(person(x))}</p></div><button class="button" data-lesson="${esc(x.name)}">查看</button></div>`).join('')||'<div class="empty">暂无即将开始的课程</div>'}</div>`}function toIcs(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())}function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}function downloadIcs(){let events=getScope().map(x=>['BEGIN:VEVENT','UID:'+icsEscape(x.name)+'@tutor-workspace','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace(/Z$/,'Z'),'DTSTART:'+toIcs(date(x.starts_at)),'DTEND:'+toIcs(date(x.ends_at)),'SUMMARY:'+icsEscape(title(x)),'DESCRIPTION:'+icsEscape(person(x)),'END:VEVENT'].join('\r\n'));let payload=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tutor Workspace//Calendar//CN','CALSCALE:GREGORIAN',...events,'END:VCALENDAR'].join('\r\n');let u=URL.createObjectURL(new Blob([payload],{type:'text/calendar;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='课程表.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});lessonEvents();let b=$('#back');if(b)b.onclick=()=>{view='calendar';render()};b=$('#prev');if(b)b.onclick=()=>{week=mode==='week'?add(week,-7):new Date(week.getFullYear(),week.getMonth()-1,1);render()};b=$('#next');if(b)b.onclick=()=>{week=mode==='week'?add(week,7):new Date(week.getFullYear(),week.getMonth()+1,1);render()};b=$('#today');if(b)b.onclick=()=>{week=monday(new Date());render()};b=$('#week-mode');if(b)b.onclick=()=>{week=monday(week);mode='week';render()};b=$('#month-mode');if(b)b.onclick=()=>{mode='month';render()};b=$('#export');if(b)b.onclick=()=>$('#export-pop').hidden=!$('#export-pop').hidden;b=$('#export-ics');if(b)b.onclick=downloadIcs;b=$('#account');if(b)b.onclick=()=>$('#account-pop').hidden=!$('#account-pop').hidden;b=$('#account-settings');if(b)b.onclick=()=>{view='settings';render()};for(let id of ['#demo-switch','#role-toggle']){b=$(id);if(b)b.onclick=switchRole}b=$('#schedule');if(b)b.onclick=()=>alert('课程创建功能尚未接入');let form=$('#reschedule');if(form)form.onsubmit=async e=>{e.preventDefault();let err=$('#form-error');if(boot.preview){err.textContent='这是静态预览，调课不会保存。';return}let data=new URLSearchParams({lesson:selected.name,starts_at:form.elements.start.value.replace('T',' '),ends_at:form.elements.end.value.replace('T',' '),reason:form.elements.reason.value});let btn=form.querySelector('button');btn.disabled=true;try{let r=await fetch('/api/method/tutor_core.portal.reschedule',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Frappe-CSRF-Token':boot.csrf},body:data});if(!r.ok)throw new Error('调课失败，请检查时间或权限。');await load();selected=rows.find(x=>x.name===selected.name);view='detail';render();$('#form-error').textContent='调课已保存。'}catch(e){err.textContent=e.message}finally{btn.disabled=false}}}function switchRole(){if(!boot.preview)return;role=role==='Teacher'?'Student':'Teacher';rows=previewRows(role);view='calendar';week=monday(new Date());render()}function render(){initNav();$('#app').innerHTML=({calendar,detail,history,students,settings,settlement,home}[view]||calendar)();bind()}function previewRows(r){const base=monday(new Date());const fixtures=r==='Teacher'?[[0,16,'初一 · 数学','周可','初一','数学','一对一',1],[1,18,'初二 · 数学','陈予','初二','数学','一对一',1],[2,18,'初三 · 数学','张宁、李沐、赵一','初三','数学','班课',3],[3,16,'初一 · 数学','吴桐','初一','数学','一对一',1],[4,18,'初二 · 数学','陈予、林安、苏宁','初二','数学','班课',3],[5,14,'初三 · 数学','刘星','初三','数学','一对一',1],[5,18,'初二 · 数学','孙悦','初二','数学','一对一',1],[6,16,'初一 · 数学','黄乐、郑可、许言','初一','数学','班课',3]]:[[1,18,'数学 · 初二','林老师','初二','数学','一对一',1],[2,18,'英语 · 初二','苏老师','初二','英语','班课',6],[4,18,'数学 · 初二','林老师','初二','数学','班课',3],[6,14,'物理 · 初二','周老师','初二','物理','一对一',1]];let result=fixtures.map((x,i)=>{let d=add(base,x[0]),a=key(d)+' '+pad(x[1])+':00:00',z=key(d)+' '+pad(x[1]+2)+':00:00';return {name:r+i,student:r==='Teacher'?x[3]:'陈予',teacher:r==='Teacher'?'林老师':x[3],course:x[2],starts_at:a,ends_at:z,status:'Scheduled',grade:x[4],subject:x[5],class_type:x[6],class_count:x[7],summaries:[]}});let old=add(base,-4);result.push({name:r+'history',student:r==='Teacher'?'陈予':'陈予',teacher:'林老师',course:'数学 · 图像与函数',starts_at:key(old)+' 18:00:00',ends_at:key(old)+' 20:00:00',status:'Completed',grade:'初二',subject:'数学',class_type:'一对一',summaries:['复习了一次函数的图像与性质。']});return result}async function load(){if(boot.preview){rows=previewRows(role);render();return}let r=await fetch('/api/method/tutor_core.portal.lessons',{credentials:'same-origin'});if(!r.ok)throw Error('课程加载失败，请重新登录。');let payload=(await r.json()).message;role=payload.kind;rows=payload.lessons;render()}$('#banner').hidden=!boot.preview;$('#switch-role').onclick=switchRole;load().catch(e=>{$('#app').innerHTML=`<p class="error">${esc(e.message)}</p>`})})();
