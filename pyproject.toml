[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor_core"
version = "0.0.1"
description = "Tutoring extensions for Frappe Education"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}

[tool.setuptools.packages.find]
include = ["tutor_core*"]
