{% extends "templates/web.html" %}
{% block page_content %}
<style>.tc-wrap{max-width:1000px;margin:30px auto;color:#192a3a}.tc-card{border:1px solid #dce5e8;border-radius:12px;padding:20px;margin:14px 0;background:white}.tc-stats{display:flex;gap:12px;flex-wrap:wrap}.tc-stat{flex:1;min-width:150px;background:#eef7f5;border-radius:10px;padding:16px}.tc-card input{max-width:220px;margin:4px}button{margin:4px} .tc-muted{color:#697982}</style>
<div class="tc-wrap"><h2>{{ '教师工作台' if kind == 'Teacher' else '学生课程' }}</h2><p class="tc-muted">{{ '查看课程与调整单次课' if kind == 'Teacher' else '查看你的课程和课堂总结' }}</p><div id="stats" class="tc-stats"></div><h3>课程安排</h3><div id="list">正在加载…</div></div>
<script>
const kind={{ kind | tojson }}, csrf={{ csrf_token | tojson }};
function safe(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
async function load(){const r=await fetch('/api/method/tutor_core.portal.lessons',{credentials:'same-origin'});if(!r.ok)throw new Error('无法加载课程');const data=(await r.json()).message, rows=data.lessons;const now=new Date(), today=now.toLocaleDateString('en-CA'); const future=rows.filter(x=>x.status==='Scheduled'&&new Date(x.starts_at.replace(' ','T'))>=now);document.getElementById('stats').innerHTML=`<div class="tc-stat">下一节课<br><b>${future.length?safe(future[0].starts_at):'暂无'}</b></div><div class="tc-stat">今日课程<br><b>${rows.filter(x=>x.starts_at.startsWith(today)).length}</b></div><div class="tc-stat">全部课程<br><b>${rows.length}</b></div>`;document.getElementById('list').innerHTML=rows.map(x=>`<div class="tc-card"><b>${safe(x.course)}</b> · ${safe(x.status)}<p>${safe(x.starts_at)} — ${safe(x.ends_at)}</p><p>${kind==='Teacher'?'学生：'+safe(x.student):'教师：'+safe(x.teacher)}</p>${kind==='Student'?(x.summaries||[]).map(t=>'<p>课堂总结：'+safe(t)+'</p>').join(''):''}${kind==='Teacher'&&x.status==='Scheduled'?`<form data-id="${safe(x.name)}"><label>调课开始 <input name="start" type="datetime-local" required></label><label>结束 <input name="end" type="datetime-local" required></label><button type="submit">调整此节课</button></form>`:''}</div>`).join('')||'<div class="tc-card">暂无课程</div>';document.querySelectorAll('form[data-id]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const body=new URLSearchParams({lesson:f.dataset.id,starts_at:f.start.value.replace('T',' '),ends_at:f.end.value.replace('T',' ')});const res=await fetch('/api/method/tutor_core.portal.reschedule',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Frappe-CSRF-Token':csrf},body});if(!res.ok){alert('调课失败，请检查时间或权限');return}await load()})}load().catch(e=>document.getElementById('list').textContent=e.message);
</script>
{% endblock %}
